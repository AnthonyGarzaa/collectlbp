<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Guitar neck -->
  <rect x="14" y="1" width="4" height="14" rx="1" fill="#8B4513"/>
  <!-- Frets -->
  <line x1="14.5" y1="4" x2="17.5" y2="4" stroke="#FFD700" stroke-width="0.6"/>
  <line x1="14.5" y1="7" x2="17.5" y2="7" stroke="#FFD700" stroke-width="0.6"/>
  <line x1="14.5" y1="10" x2="17.5" y2="10" stroke="#FFD700" stroke-width="0.6"/>
  <!-- Headstock -->
  <rect x="12" y="0" width="8" height="3" rx="1" fill="#C62828"/>
  <!-- Tuning pegs -->
  <circle cx="13" cy="1" r="0.8" fill="#FFD700"/>
  <circle cx="19" cy="1" r="0.8" fill="#FFD700"/>
  <circle cx="13" cy="2.5" r="0.8" fill="#FFD700"/>
  <circle cx="19" cy="2.5" r="0.8" fill="#FFD700"/>
  <!-- Guitar body -->
  <ellipse cx="16" cy="22" rx="9" ry="8" fill="#D32F2F"/>
  <!-- Body curve cutaway -->
  <ellipse cx="16" cy="17" rx="6" ry="4" fill="#E53935"/>
  <!-- Sound hole -->
  <circle cx="16" cy="22" r="3" fill="#1A1A1A"/>
  <circle cx="16" cy="22" r="2.3" fill="none" stroke="#FFD700" stroke-width="0.5"/>
  <!-- Bridge -->
  <rect x="14" y="26" width="4" height="1.5" rx="0.5" fill="#8B4513"/>
  <!-- Strings -->
  <line x1="15" y1="3" x2="15" y2="27" stroke="#FFD700" stroke-width="0.3"/>
  <line x1="16" y1="3" x2="16" y2="27" stroke="#FFD700" stroke-width="0.3"/>
  <line x1="17" y1="3" x2="17" y2="27" stroke="#FFD700" stroke-width="0.3"/>
</svg>
